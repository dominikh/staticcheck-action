name: Testing the action for dependencies

on:
  push: 
  pull_request:

permissions: 
  contents: read

jobs:
  default-parameters:
    name: Minimal setup
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with: { repository: dominikh/go-tools, ref: ff63afafc529279f454e02f1d060210bd4263951 } # v0.7.0
    - uses: ./

  configured:
    name: Minimal setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:  ["ubuntu-latest"]
        go:  ["1.18.x", "1.21.x", "1.26.x"]
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with: { repository: dominikh/go-tools, ref: ff63afafc529279f454e02f1d060210bd4263951 } # v0.7.0
    - uses: actions/setup-go@v6
      with: { go-version: "${{ matrix.go }}" }
    - uses: ./
      with:
        version: "latest"
        install-go: false
        cache-key: ${{ matrix.go }}
        working-directory: .
